<style>
:root {
  --bg: #f7f7f4; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #7c7b76;
  --grid: #e6e5e1; --line: #d9d8d3; --blue: #2a78d6; --orange: #eb6834; --gray: #b8b7b2; --aqua: #1baf7a;
  --focus: #2a78d6; --tint: #f0efec;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --surface: #1a1a19; --ink: #f4f4f1; --ink2: #c3c2b7; --muted: #8f8e88;
    --grid: #2c2c2a; --line: #383835; --blue: #3987e5; --orange: #d95926; --gray: #6a6964; --aqua: #199e70;
    --focus: #6da7ec; --tint: #232321;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --surface: #1a1a19; --ink: #f4f4f1; --ink2: #c3c2b7; --muted: #8f8e88;
  --grid: #2c2c2a; --line: #383835; --blue: #3987e5; --orange: #d95926; --gray: #6a6964; --aqua: #199e70;
  --focus: #6da7ec; --tint: #232321;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5;
  padding-inline: 16px; padding-block: 28px 48px; }
.wrap { max-width: 1000px; margin-inline: auto; }
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
h1 { font-size: clamp(22px, 3.4vw, 30px); line-height: 1.15; font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; max-width: 28ch; }
.lede { color: var(--ink2); max-width: 66ch; margin: 0 0 20px; }
.key { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; margin: 0 0 20px; padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.key b { font-family: var(--mono); font-weight: 500; font-size: 26px; letter-spacing: -0.02em; }
.key span.l { color: var(--ink2); font-size: 13.5px; }
.key div { display: flex; align-items: baseline; gap: 10px; }
.grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
@media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
.panel h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); margin: 0 0 12px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--grid); }
.row:first-of-type { border-top: 0; padding-top: 0; }
.row .name { font-weight: 500; }
.row .marg { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink2); }
.row .marg b { font-family: var(--mono); font-weight: 500; color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; padding: 5px 12px; border: 0; background: transparent; color: var(--ink2); cursor: pointer; min-width: 62px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 500; }
.lang button { min-width: 44px; padding: 4px 10px; }
.seg button:focus-visible, .btn:focus-visible, summary:focus-visible, td button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--grid); }
.btn { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { background: var(--tint); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink2); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.chart { position: relative; }
svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--ink2); font-family: var(--sans); font-size: 12px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12.5px; padding: 8px 10px; border-radius: 5px;
  max-width: 240px; line-height: 1.4; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
.tip .mono { font-family: var(--mono); }
.read { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px 20px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--grid); }
.read .k { font-size: 12px; color: var(--muted); }
.read .v { font-family: var(--mono); font-size: 20px; font-weight: 500; }
.read .v.small { font-size: 14px; font-family: var(--sans); font-weight: 500; }
.badge { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; }
.badge i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.badge.yes i { background: var(--blue); }
.badge.no i { border: 2px solid var(--muted); background: transparent; }
.note { margin-top: 22px; padding: 14px 16px; border-left: 3px solid var(--orange); background: var(--surface); border-radius: 0 6px 6px 0; color: var(--ink2); font-size: 14px; max-width: 78ch; }
.note b { color: var(--ink); }
details { margin-top: 22px; }
summary { cursor: pointer; font-weight: 500; padding: 4px 0; }
.tbl { overflow: auto; max-height: 360px; border: 1px solid var(--line); border-radius: 6px; margin-top: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--tint); font-size: 12px; color: var(--ink2); font-weight: 600; }
td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
tr.sel td { background: var(--tint); }
td button { font: inherit; font-family: var(--mono); background: none; border: 0; color: var(--blue); cursor: pointer; padding: 0; text-decoration: underline; }
.foot { margin-top: 26px; font-size: 12.5px; color: var(--muted); max-width: 78ch; }
@media (prefers-reduced-motion: no-preference) { .seg button { transition: background .12s; } }
</style>

</div>

      svg += '<circle class="hit" data-m="' + d.m + '" cx="' + X(d.rank) + '" cy="' + Y(d.h) + '" r="9" fill="transparent" style="cursor:pointer"/>';
    });
    svg += '</svg><div class="tip" id="tip" hidden></div>';
    $("chart").innerHTML = svg;
  }

  function drawControls() {
    var l = L(), ctl = $("controls");
    ctl.innerHTML = "";
    TYPES.forEach(function (t, i) {
      var row = document.createElement("div"); row.className = "row";
      row.innerHTML = '<span class="name">' + t + '</span>' +
        '<span class="seg" role="group" aria-label="' + t + '">' +
        '<button type="button" data-i="' + i + '" data-b="0" id="t' + i + 'e">' + l.exc + '</button>' +
        '<button type="button" data-i="' + i + '" data-b="1" id="t' + i + 'i">' + l.inh + '</button></span>' +
        '<span class="marg">' + l.marg(fr(i, 0), fr(i, 1)) + '</span>';
      ctl.appendChild(row);
    });
  }

  function drawTable() {
    var l = L(), tb = document.querySelector("#tbl tbody");
    $("thr").innerHTML = l.th.map(function (h) { return "<th>" + h + "</th>"; }).join("");
    tb.innerHTML = "";
    data.forEach(function (d) {
      var tr = document.createElement("tr"); tr.id = "r" + d.m;
      tr.innerHTML = '<td class="n"><button type="button" data-m="' + d.m + '">' + d.rank + '</button></td><td>' +
        (inh(d.m).join(", ") || l.none) + (d.m === REAL ? ' <b style="color:var(--orange)">(' + l.realTag + ')</b>' : "") +
        '</td><td class="n">' + d.h.toFixed(3) + '</td><td class="n">' + d.s.toFixed(2) + '</td><td class="n">' + d.a.toFixed(0) +
        '</td><td>' + (d.ok ? l.tYes : l.tNo) + '</td>';
      tb.appendChild(tr);
    });
  }

  function texts() {
    var l = L();
    document.documentElement.lang = lang;
    document.title = l.title;
    $("h1").textContent = l.h1; $("lede").innerHTML = l.lede;
    $("kInt").textContent = nInt; $("kIntL").textContent = l.kIntL;
    $("kRank").textContent = l.ord(byMask[REAL].rank); $("kRankL").textContent = l.kRankL;
    $("kP").textContent = "p = " + (byMask[REAL].rank / 64).toFixed(2); $("kPL").textContent = l.kPL;
    $("hc").textContent = l.hc; $("hg").textContent = l.hg;
    $("bReal").textContent = l.bReal; $("bBest").textContent = l.bBest; $("bWorst").textContent = l.bWorst;
    $("lgYes").textContent = l.lgYes; $("lgNo").textContent = l.lgNo; $("lgReal").textContent = l.lgReal; $("lgSel").textContent = l.lgSel;
    $("note").innerHTML = l.note; $("sum").textContent = l.sum; $("foot").innerHTML = l.foot;
    $("lES").setAttribute("aria-pressed", lang === "es" ? "true" : "false");
    $("lEN").setAttribute("aria-pressed", lang === "en" ? "true" : "false");
  }

  function update() {
    var l = L();
    TYPES.forEach(function (t, i) {
      var on = (sel >> i) & 1;
      $("t" + i + "e").setAttribute("aria-pressed", on ? "false" : "true");
      $("t" + i + "i").setAttribute("aria-pressed", on ? "true" : "false");
    });
    var d = byMask[sel], ring = $("ring");
    ring.setAttribute("cx", X(d.rank)); ring.setAttribute("cy", Y(d.h));
    var name = inh(sel).join(", ") || l.none;
    $("read").innerHTML =
      '<div><div class="k">' + l.rInhib + '</div><div class="v small">' + name + (sel === REAL ? ' <span style="color:var(--orange)">· ' + l.realTag + '</span>' : "") + '</div></div>' +
      '<div><div class="k">' + l.rRank + '</div><div class="v">' + d.rank + ' / 64</div></div>' +
      '<div><div class="k">' + l.rLoss + '</div><div class="v">' + d.h.toFixed(3) + '</div></div>' +
      '<div><div class="k">' + l.rSlope + '</div><div class="v">' + d.s.toFixed(2) + '</div></div>' +
      '<div><div class="k">' + l.rRes + '</div><div class="v small"><span class="badge ' + (d.ok ? "yes" : "no") + '"><i></i>' + (d.ok ? l.yes : l.no) + '</span></div></div>';
    var prev = document.querySelector("tr.sel"); if (prev) prev.classList.remove("sel");
    $("r" + sel).classList.add("sel");
  }

  function renderAll() { texts(); drawControls(); drawChart(); drawTable(); update(); }

  // ---- eventos (delegados: se conservan al redibujar)
  $("controls").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-i]"); if (!b) return;
    var i = +b.dataset.i, bit = +b.dataset.b;
    sel = bit ? (sel | (1 << i)) : (sel & ~(1 << i)); update();
  });
  $("bReal").onclick = function () { sel = REAL; update(); };
  $("bBest").onclick = function () { sel = data[0].m; update(); };
  $("bWorst").onclick = function () { sel = data[63].m; update(); };
  $("lES").onclick = function () { lang = "es"; try { localStorage.setItem("cx-lang", lang); } catch (e) {} renderAll(); };
  $("lEN").onclick = function () { lang = "en"; try { localStorage.setItem("cx-lang", lang); } catch (e) {} renderAll(); };
  var chart = $("chart");
  chart.addEventListener("click", function (e) { var h = e.target.closest(".hit"); if (h) { sel = +h.dataset.m; update(); } });
  chart.addEventListener("mousemove", function (e) {
    var h = e.target.closest(".hit"), tip = $("tip");
    if (!h) { tip.hidden = true; return; }
    var l = L(), d = byMask[+h.dataset.m], box = chart.getBoundingClientRect();
    tip.innerHTML = '<b>' + l.rank + ' ' + d.rank + '</b><br>' + l.inhibiting + ': ' + (inh(d.m).join(", ") || l.none) +
      '<br><span class="mono">' + l.loss + ' ' + d.h.toFixed(3) + ' · ' + l.slope + ' ' + d.s.toFixed(2) + '</span>';
    tip.hidden = false;
    var x = e.clientX - box.left + 14, y = e.clientY - box.top + 14;
    if (x + 240 > box.width) x = e.clientX - box.left - 250;
    tip.style.left = Math.max(0, x) + "px"; tip.style.top = y + "px";
  });
  chart.addEventListener("mouseleave", function () { $("tip").hidden = true; });
  document.querySelector("#tbl tbody").addEventListener("click", function (e) { var b = e.target.closest("button[data-m]"); if (b) { sel = +b.dataset.m; update(); } });

  renderAll();
})();
</script>
</html>
